# Supervised PCN on MNIST (clamp image + one-hot label during training).
seed: 0
device: auto

# Architecture
# dims: [784, 256, 256, 10]
dims: [784, 16, 16, 10]
activation: tanh
init: xavier
init_std: 0.05
# Predictions flow image -> label so the OUTPUT error drives learning
# (inference learning approximates backprop -> MLP-level accuracy).
direction: discriminative

# Inference (relaxation)
gamma: 0.1
T: 50 # inference steps during training
T_test: 100 # inference steps at classification time

# Learning -- PC inference-learning fits slower than backprop, so we train for
# more epochs and cosine-anneal the weight LR (the constant-LR run plateaus and
# oscillates in the mid-90s; the schedule lands it at MLP-level accuracy).
optimizer: adam
lr: 0.001
lr_schedule: cosine
lr_min: 0.00001
batch_size: 128
epochs: 75
target_low: -1.0
target_high: 1.0

# Bookkeeping
val_every: 1
out_dir: outputs/supervised
