[project]
name = "pcn-mnist"
version = "0.1.0"
description = "Hierarchical Predictive Coding Networks trained by inference learning on MNIST"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcn"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E741"]                        # allow `l` as a layer index (matches the math notation)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
